<circle class="pulse" style="animation-delay:-1s" cx="18" cy="16" r="4" fill="#a5b4fc"/><text x="32" y="21" font-size="15" fill="#e6edf3">Business Intelligence</text>
<path class="signal" d="M16 31.5H217" stroke="#a5b4fc" stroke-opacity=".8"/></g><g transform="translate(423 0)"><rect x=".5" y=".5" width="124" height="31" rx="16" fill="#080e19" stroke="#29384c"/>
<circle class="pulse" style="animation-delay:-2s" cx="18" cy="16" r="4" fill="#5eead4"/><text x="32" y="21" font-size="15" fill="#e6edf3">AI Agents</text>
<path class="signal" d="M16 31.5H109" stroke="#5eead4" stroke-opacity=".8"/></g><g transform="translate(558 0)"><rect x=".5" y=".5" width="133" height="31" rx="16" fill="#080e19" stroke="#29384c"/>
