<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="t d"><title id="t">Warehouse → BI → AI automation</title><desc id="d">Store it properly, make it visible, let agents act on it.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#163047" stroke-opacity=".35"/></pattern>
<linearGradient id="sh"><stop stop-color="#7dd3fc" stop-opacity="0"/><stop offset=".5" stop-color="#e6f6ff"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="900" height="200" rx="14"/></clipPath></defs>
<style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.signal{stroke-dasharray:4 14;animation:signal 5s linear infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
.edge{stroke-dasharray:10 90;animation:edge 10s linear infinite}
.sheen{animation:sheen 12s ease-in-out infinite;opacity:0}
.float{animation:float 6s ease-in-out infinite}
.chev{animation:chev 3s ease-in-out infinite}
.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes signal{to{stroke-dashoffset:-180}}
@keyframes pulse{50%{opacity:.35}}
@keyframes edge{to{stroke-dashoffset:-100}}
@keyframes sheen{0%,15%{transform:translateX(-200px);opacity:0}25%{opacity:.08}65%{transform:translateX(var(--t));opacity:.08}75%,100%{transform:translateX(var(--t));opacity:0}}
@keyframes float{50%{transform:translateY(-4px)}}
@keyframes chev{50%{transform:translateX(5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.sheen,.edge{display:none}}</style>
<rect width="900" height="200" rx="14" fill="#080e19"/><rect width="900" height="200" rx="14" fill="url(#grid)"/>
<g clip-path="url(#clip)" aria-hidden="true"><rect class="sheen" style="--t:1300px" x="-180" width="180" height="200" fill="url(#sh)"/>
<rect x=".5" y=".5" width="899" height="199" rx="14" fill="none" stroke="#23334c"/>
<rect class="edge" x="1" y="1" width="898" height="198" rx="14" pathLength="100" fill="none" stroke="#7dd3fc" stroke-opacity=".6"/></g>

<text x="40" y="50" font-size="18" letter-spacing="4" fill="#7dd3fc">01 · WHAT I DO</text>
<text class="sans" x="40" y="96" font-size="34" font-weight="600" fill="#e6edf3">Warehouse → BI → AI automation</text>
<text class="sans" x="40" y="136" font-size="22" fill="#a7b8ce">Store it properly, make it visible, let agents act on it.</text>
<path d="M40 172H860" stroke="#23334c" stroke-width="2"/><path class="signal" d="M40 172H860" stroke="#7dd3fc" stroke-width="2"/>
<g transform="translate(620 84) scale(.9)"><g fill="none" stroke="#7dd3fc" stroke-width="2"><ellipse cx="0" cy="-20" rx="24" ry="8"/><path d="M-24-20V20A24 8 0 0 0 24 20V-20"/><path d="M-24-6A24 8 0 0 0 24-6M-24 7A24 8 0 0 0 24 7" stroke-opacity=".6"/></g></g><g transform="translate(720 84) scale(.9)"><g stroke="#a5b4fc" stroke-width="2" fill="#a5b4fc" fill-opacity=".15"><rect x="-24" y="2" width="11" height="22" rx="2"/><rect class="pulse" x="-6" y="-12" width="11" height="36" rx="2"/><rect x="12" y="-24" width="11" height="48" rx="2"/></g><path d="M-28 26H28" stroke="#a5b4fc" stroke-opacity=".5"/></g><g transform="translate(820 84) scale(.9)"><g stroke="#5eead4" stroke-width="2" fill="none"><path d="M0-20L-20 14M0-20L20 14M-20 14H20" stroke-opacity=".5"/><circle cx="0" cy="-20" r="8" fill="#080e19"/><circle cx="-20" cy="14" r="8" fill="#080e19"/><circle cx="20" cy="14" r="8" fill="#080e19"/><circle class="pulse" cx="0" cy="-20" r="3" fill="#5eead4"/></g></g>
</svg>
