<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="t d"><title id="t">ResumerAgent</title><desc id="d">Finds every Claude Code session, even the dead ones, and resumes any of them in one click.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#163047" stroke-opacity=".35"/></pattern>
<linearGradient id="sh"><stop stop-color="#5eead4" stop-opacity="0"/><stop offset=".5" stop-color="#e6f6ff"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="440" height="280" rx="14"/></clipPath></defs>
<style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.signal{stroke-dasharray:4 14;animation:signal 5s linear infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
.edge{stroke-dasharray:10 90;animation:edge 10s linear infinite}
.sheen{animation:sheen 12s ease-in-out infinite;opacity:0}
.float{animation:float 6s ease-in-out infinite}
.chev{animation:chev 3s ease-in-out infinite}
.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes signal{to{stroke-dashoffset:-180}}
@keyframes pulse{50%{opacity:.35}}
@keyframes edge{to{stroke-dashoffset:-100}}
@keyframes sheen{0%,15%{transform:translateX(-200px);opacity:0}25%{opacity:.08}65%{transform:translateX(var(--t));opacity:.08}75%,100%{transform:translateX(var(--t));opacity:0}}
@keyframes float{50%{transform:translateY(-4px)}}
@keyframes chev{50%{transform:translateX(5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.sheen,.edge{display:none}}</style>
<rect width="440" height="280" rx="14" fill="#080e19"/><rect width="440" height="280" rx="14" fill="url(#grid)"/>
<g clip-path="url(#clip)" aria-hidden="true"><rect class="sheen" style="--t:840px" x="-180" width="180" height="280" fill="url(#sh)"/>
<rect x=".5" y=".5" width="439" height="279" rx="14" fill="none" stroke="#23334c"/>
<rect class="edge" x="1" y="1" width="438" height="278" rx="14" pathLength="100" fill="none" stroke="#5eead4" stroke-opacity=".6"/></g>

<path d="M16 16H40M16 16V40M424 264H400M424 264V240" fill="none" stroke="#5eead4"/>
<text x="28" y="54" font-size="16" letter-spacing="2" fill="#5eead4">CLAUDE CODE · SESSIONS</text>
<g transform="translate(392 50) scale(.85)"><g class="float"><g stroke="#5eead4" stroke-width="2" fill="none"><rect x="-26" y="-20" width="52" height="40" rx="5"/><path d="M-26-9H26" stroke-opacity=".6"/><path d="M-16 0L-8 6-16 12" /><path class="pulse" d="M-2 12H12"/></g></g></g>
<text class="sans" x="28" y="112" font-size="34" font-weight="700" fill="#e6edf3">ResumerAgent</text>
<text class="sans" x="28" y="152" font-size="23" fill="#a7b8ce">Finds every Claude Code session,</text>
<text class="sans" x="28" y="182" font-size="23" fill="#a7b8ce">even the dead ones, and resumes</text>
<text class="sans" x="28" y="212" font-size="23" fill="#a7b8ce">any of them in one click.</text>
<text x="28" y="250" font-size="16" fill="#6b7d93">Node.js · zero deps · MIT</text>
<g class="chev"><text x="404" y="250" font-size="17" fill="#5eead4" text-anchor="end">explore →</text></g>
</svg>
