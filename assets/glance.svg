<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="t d"><title id="t">At a glance: what Arman works on</title><desc id="d">Four domains: data warehouse (Data Vault 2.0, SQL Server, SSIS, BIML), business intelligence (Power BI, DAX, Azure Fabric and Synapse), AI agents (multi-agent Claude Code, MCP, Obsidian vault as memory) and automation with safety layers.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#163047" stroke-opacity=".35"/></pattern>
<linearGradient id="sh"><stop stop-color="#5eead4" stop-opacity="0"/><stop offset=".5" stop-color="#e6f6ff"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="900" height="470" rx="14"/></clipPath></defs>
<style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.signal{stroke-dasharray:4 14;animation:signal 5s linear infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
.edge{stroke-dasharray:10 90;animation:edge 10s linear infinite}
.sheen{animation:sheen 12s ease-in-out infinite;opacity:0}
.float{animation:float 6s ease-in-out infinite}
.chev{animation:chev 3s ease-in-out infinite}
.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes signal{to{stroke-dashoffset:-180}}
@keyframes pulse{50%{opacity:.35}}
@keyframes edge{to{stroke-dashoffset:-100}}
@keyframes sheen{0%,15%{transform:translateX(-200px);opacity:0}25%{opacity:.08}65%{transform:translateX(var(--t));opacity:.08}75%,100%{transform:translateX(var(--t));opacity:0}}
@keyframes float{50%{transform:translateY(-4px)}}
@keyframes chev{50%{transform:translateX(5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.sheen,.edge{display:none}}</style>
<rect width="900" height="470" rx="14" fill="#080e19"/><rect width="900" height="470" rx="14" fill="url(#grid)"/>
<g clip-path="url(#clip)" aria-hidden="true"><rect class="sheen" style="--t:1300px" x="-180" width="180" height="470" fill="url(#sh)"/>
<rect x=".5" y=".5" width="899" height="469" rx="14" fill="none" stroke="#23334c"/>
<rect class="edge" x="1" y="1" width="898" height="468" rx="14" pathLength="100" fill="none" stroke="#5eead4" stroke-opacity=".6"/></g>
<text x="40" y="54" font-size="18" letter-spacing="4" fill="#5eead4">AT A GLANCE</text>
<text class="sans" x="40" y="92" font-size="30" font-weight="600" fill="#e6edf3">What I work on</text>
<g transform="translate(40 120)"><rect x=".5" y=".5" width="399" height="149" rx="10" fill="#0c1422" stroke="#1f2d40"/>
<rect x="0" y="20" width="3" height="40" fill="#7dd3fc"/>
<g transform="translate(352 44) scale(.75)"><g fill="none" stroke="#7dd3fc" stroke-width="2"><ellipse cx="0" cy="-20" rx="24" ry="8"/><path d="M-24-20V20A24 8 0 0 0 24 20V-20"/><path d="M-24-6A24 8 0 0 0 24-6M-24 7A24 8 0 0 0 24 7" stroke-opacity=".6"/></g></g>
<text x="24" y="44" font-size="18" letter-spacing="2" fill="#7dd3fc">DATA WAREHOUSE</text>
<text class="sans" x="24" y="94" font-size="25" fill="#e6edf3">Data Vault 2.0, SQL Server</text>
<text class="sans" x="24" y="128" font-size="25" fill="#a7b8ce">SSIS &amp; BIML pipelines, T-SQL</text></g>
<g transform="translate(460 120)"><rect x=".5" y=".5" width="399" height="149" rx="10" fill="#0c1422" stroke="#1f2d40"/>
<rect x="0" y="20" width="3" height="40" fill="#a5b4fc"/>
<g transform="translate(352 44) scale(.75)"><g stroke="#a5b4fc" stroke-width="2" fill="#a5b4fc" fill-opacity=".15"><rect x="-24" y="2" width="11" height="22" rx="2"/><rect class="pulse" x="-6" y="-12" width="11" height="36" rx="2"/><rect x="12" y="-24" width="11" height="48" rx="2"/></g><path d="M-28 26H28" stroke="#a5b4fc" stroke-opacity=".5"/></g>
<text x="24" y="44" font-size="18" letter-spacing="2" fill="#a5b4fc">BUSINESS INTELLIGENCE</text>
<text class="sans" x="24" y="94" font-size="25" fill="#e6edf3">Power BI &amp; DAX models</text>
<text class="sans" x="24" y="128" font-size="25" fill="#a7b8ce">Azure Fabric &amp; Synapse</text></g>
<g transform="translate(40 290)"><rect x=".5" y=".5" width="399" height="149" rx="10" fill="#0c1422" stroke="#1f2d40"/>
<rect x="0" y="20" width="3" height="40" fill="#5eead4"/>
<g transform="translate(352 44) scale(.75)"><g stroke="#5eead4" stroke-width="2" fill="none"><path d="M0-20L-20 14M0-20L20 14M-20 14H20" stroke-opacity=".5"/><circle cx="0" cy="-20" r="8" fill="#080e19"/><circle cx="-20" cy="14" r="8" fill="#080e19"/><circle cx="20" cy="14" r="8" fill="#080e19"/><circle class="pulse" cx="0" cy="-20" r="3" fill="#5eead4"/></g></g>
<text x="24" y="44" font-size="18" letter-spacing="2" fill="#5eead4">AI AGENTS</text>
<text class="sans" x="24" y="94" font-size="25" fill="#e6edf3">Multi-agent Claude Code, MCP</text>
<text class="sans" x="24" y="128" font-size="25" fill="#a7b8ce">Obsidian vault as memory</text></g>
<g transform="translate(460 290)"><rect x=".5" y=".5" width="399" height="149" rx="10" fill="#0c1422" stroke="#1f2d40"/>
<rect x="0" y="20" width="3" height="40" fill="#fbbf24"/>
<g transform="translate(352 44) scale(.75)"><g stroke="#fbbf24" stroke-width="2" fill="none"><path d="M0-26L22-17V0C22 14 12 22 0 27C-12 22-22 14-22 0V-17Z" fill="#fbbf24" fill-opacity=".1"/><path d="M-9 0L-2 7 11-7"/></g></g>
<text x="24" y="44" font-size="18" letter-spacing="2" fill="#fbbf24">AUTOMATION, SAFELY</text>
<text class="sans" x="24" y="94" font-size="25" fill="#e6edf3">Finance &amp; content agents</text>
<text class="sans" x="24" y="128" font-size="25" fill="#a7b8ce">kill switches, risk caps</text></g>
</svg>
