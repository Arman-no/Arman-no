<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">Arman Nouromid - Data &amp; BI Engineer, building AI automation that ships</title><desc id="d">Animated banner: a data line runs from a warehouse, through a chart, to a small agent network.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#163047" stroke-opacity=".35"/></pattern>
<linearGradient id="sh"><stop stop-color="#5eead4" stop-opacity="0"/><stop offset=".5" stop-color="#e6f6ff"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="1200" height="360" rx="14"/></clipPath></defs>
<style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.signal{stroke-dasharray:4 14;animation:signal 5s linear infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
.edge{stroke-dasharray:10 90;animation:edge 10s linear infinite}
.sheen{animation:sheen 12s ease-in-out infinite;opacity:0}
.float{animation:float 6s ease-in-out infinite}
.chev{animation:chev 3s ease-in-out infinite}
.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes signal{to{stroke-dashoffset:-180}}
@keyframes pulse{50%{opacity:.35}}
@keyframes edge{to{stroke-dashoffset:-100}}
@keyframes sheen{0%,15%{transform:translateX(-200px);opacity:0}25%{opacity:.08}65%{transform:translateX(var(--t));opacity:.08}75%,100%{transform:translateX(var(--t));opacity:0}}
@keyframes float{50%{transform:translateY(-4px)}}
@keyframes chev{50%{transform:translateX(5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.sheen,.edge{display:none}}</style>
<rect width="1200" height="360" rx="14" fill="#080e19"/><rect width="1200" height="360" rx="14" fill="url(#grid)"/>
<g clip-path="url(#clip)" aria-hidden="true"><rect class="sheen" style="--t:1600px" x="-180" width="180" height="360" fill="url(#sh)"/>
<rect x=".5" y=".5" width="1199" height="359" rx="14" fill="none" stroke="#23334c"/>
<rect class="edge" x="1" y="1" width="1198" height="358" rx="14" pathLength="100" fill="none" stroke="#5eead4" stroke-opacity=".6"/></g>

<path d="M24 24H56M24 24V56M1176 336H1144M1176 336V304" fill="none" stroke="#5eead4"/>
<text x="600" y="92" font-size="20" letter-spacing="6" fill="#5eead4" text-anchor="middle">DATA · BI · AI AUTOMATION</text>
<text class="sans" x="600" y="168" font-size="76" font-weight="700" letter-spacing="2" fill="#e6edf3" text-anchor="middle">Arman Nouromid</text>
<text class="sans" x="600" y="218" font-size="34" fill="#a7b8ce" text-anchor="middle">Data &amp; BI Engineer · building AI automation that ships</text>
<path d="M60 300C260 300 300 250 460 250S700 300 860 290 1080 250 1140 250" fill="none" stroke="#23334c" stroke-width="2"/>
<path class="signal" d="M60 300C260 300 300 250 460 250S700 300 860 290 1080 250 1140 250" fill="none" stroke="#5eead4" stroke-width="2"/>
<g transform="translate(150 270) scale(.7)" opacity=".85"><g fill="none" stroke="#7dd3fc" stroke-width="2"><ellipse cx="0" cy="-20" rx="24" ry="8"/><path d="M-24-20V20A24 8 0 0 0 24 20V-20"/><path d="M-24-6A24 8 0 0 0 24-6M-24 7A24 8 0 0 0 24 7" stroke-opacity=".6"/></g></g>
<g transform="translate(600 280) scale(.7)" opacity=".85"><g class="float"><g stroke="#a5b4fc" stroke-width="2" fill="#a5b4fc" fill-opacity=".15"><rect x="-24" y="2" width="11" height="22" rx="2"/><rect class="pulse" x="-6" y="-12" width="11" height="36" rx="2"/><rect x="12" y="-24" width="11" height="48" rx="2"/></g><path d="M-28 26H28" stroke="#a5b4fc" stroke-opacity=".5"/></g></g>
<g transform="translate(1050 262) scale(.7)" opacity=".85"><g stroke="#5eead4" stroke-width="2" fill="none"><path d="M0-20L-20 14M0-20L20 14M-20 14H20" stroke-opacity=".5"/><circle cx="0" cy="-20" r="8" fill="#080e19"/><circle cx="-20" cy="14" r="8" fill="#080e19"/><circle cx="20" cy="14" r="8" fill="#080e19"/><circle class="pulse" cx="0" cy="-20" r="3" fill="#5eead4"/></g></g>

</svg>
